name: flutter_samples
description: A new Flutter application.
version: 3.1.7+51

environment:
  sdk: ">=3.4.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.5.1
  go_router: ^16.1.0
  
  # UI & UX
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296
  flutter_styled_toast: ^2.2.1
  flutter_speed_dial: ^7.0.0
  cached_network_image: ^3.3.1
  keyboard_actions: ^4.2.0

  # Forms
  flutter_form_builder: ^9.4.0
  form_builder_validators: ^11.0.0

  # Device & Hardware
  mobile_scanner: ^5.1.1 # Replaces barcode_scan2 and flutter_barcode_listener
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  flutter_barcode_listener: ^0.1.3

  # Other
  image: ^4.2.0
  mime: ^1.0.5
  string_validator: ^1.1.0
  visibility_detector: ^0.4.0+2
  flutter_inappwebview: ^6.0.0
  flutter_email_sender: ^6.0.3
  mailto: ^2.0.0
  http_parser: ^4.0.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/ncnr.jpg
    - assets/images/Al-cans.jpg
    - assets/images/Brookhaven.jpg
    - assets/images/dcs-can.jpg
    - assets/images/V-cells.jpg
    - assets/images/blue_glow.jpg
    - assets/images/avatar.jpg
